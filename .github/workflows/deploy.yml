name: Deploy Little Light

on:
  push:
    branches: [ main ]

# 说明：网站代码统一用仓库里的 little-light/ 文件夹。
# 聊天接口由该文件夹下的 functions/（Pages Functions）在同一域名提供，
# AI 模型钥匙（OPENAI_API_KEY / DEEPSEEK_API_KEY）在 Cloudflare 后台设置，
# 不写进代码，安全且好改。
jobs:
  deploy-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: little-light
          directory: little-light
          branch: main
